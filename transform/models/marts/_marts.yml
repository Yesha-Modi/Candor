version: 2

models:

  # ---------- Dimensions ----------

  - name: dim_customers
    description: >
      One row per person, keyed on customer_unique_id (96,096 rows) — NOT per order.
      The source customers table has one row per order (99,441); customer_id is an
      order-level key, not a person. Address is taken from the person's most recent
      order. Latitude and longitude are empty where the postcode has no geolocation
      match; those customers are kept rather than dropped.
    columns:
      - name: customer_key
        description: The person. Join orders here, not on customer_id.
        data_tests: [unique, not_null]
      - name: order_count
        description: How many orders this person has placed, across all time.
        data_tests: [not_null]
      - name: is_repeat_customer
        description: True when order_count is greater than 1.
        data_tests: [not_null]

  - name: dim_products
    description: >
      One row per product (32,951). Category resolves in this order: Olist's English
      translation, then our own override seed, then the Portuguese name, then 'unknown'.
      Olist's translation table is missing two categories affecting 13 products
      (portateis_cozinha_e_preparadores_de_alimentos and pc_gamer) — those are supplied
      by seeds/category_translation_overrides.csv, kept separate so it is clear which
      translations are Olist's and which are ours. 610 products have no category at all
      in the source and are labelled 'unknown'. Nothing is left empty, so uncategorised
      products group visibly instead of disappearing.
    columns:
      - name: product_key
        data_tests: [unique, not_null]
      - name: category
        description: English name, override, Portuguese name, or 'unknown'. Never empty.
        data_tests: [not_null]

  - name: dim_sellers
    description: >
      One row per seller. Latitude and longitude are empty where the postcode has no
      geolocation match.
    columns:
      - name: seller_key
        data_tests: [unique, not_null]

  - name: dim_dates
    description: >
      One row per calendar day, covering full years from the first to the last order.
      Built from a generated series, not from source data. Join here for month,
      quarter, and weekend grouping rather than computing dates inline.
    columns:
      - name: date_key
        data_tests: [unique, not_null]
      - name: month_start
        description: First day of the month. Group by this, not month_name.
        data_tests: [not_null]

  # ---------- Facts ----------

  - name: fct_orders
    description: >
      One row per order (99,441). Money columns are aggregated from items, payments and
      reviews BEFORE joining, so nothing is multiplied. Use is_delivered for revenue
      questions — it is the only status where goods demonstrably arrived. 775 orders have
      no items at all and are kept with item_count 0. Delivery-time columns are empty for
      orders with no delivery date, including two that claim delivered status without one.
    columns:
      - name: order_key
        data_tests: [unique, not_null]
      - name: customer_key
        description: The person who ordered. Joins to dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_key
      - name: order_date
        description: Purchase date. Join to dim_dates for month and quarter grouping.
        data_tests: [not_null]
      - name: is_delivered
        description: The default filter for revenue questions.
        data_tests: [not_null]
      - name: item_count
        description: Number of line items. Zero for the 775 orders with none.
        data_tests: [not_null]

  - name: fct_order_items
    description: >
      One row per line item (112,650). This is a finer level of detail than fct_orders —
      joining the two multiplies order rows by their item count, so never add up an
      order-level number after joining them. Order status is copied here so that
      product-level questions can filter on it without a join.
    columns:
      - name: order_item_key
        description: order_id and item_number joined with a hyphen. Unique.
        data_tests: [unique, not_null]
      - name: order_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_key
      - name: product_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_key
      - name: seller_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_key
      - name: item_price
        data_tests: [not_null]