- id: Q030
  category: multi_table_join
  question: How many products have never been sold in a delivered order?
  expected_behavior: answer
  sql: |
    select count(*) as never_sold_products
    from marts.dim_products p
    where not exists (
        select 1
        from marts.fct_order_items i
        where i.product_key = p.product_key
          and i.is_delivered
    )
  verified: false
  notes: ""