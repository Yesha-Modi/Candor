- id: Q051
  category: unanswerable
  question: What is our profit margin by product category?
  expected_behavior: refuse
  reason: >
    There is no cost data anywhere in the dataset. Olist records what customers paid,
    not what goods cost to source, so margin cannot be computed at any grain. The
    dangerous failure here is substituting freight for cost and calling the remainder
    margin.
  verified: true
  notes: ""

- id: Q052
