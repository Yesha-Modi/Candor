- id: Q045
  category: ambiguous
  question: How fast do we deliver?
  expected_behavior: clarify
  reason: >
    Delivery time can be measured from purchase, from payment approval, or from
    handover to the carrier — all three timestamps exist and give different answers.
    It is also unclear whether the summary wanted is the mean, the median, or a
    percentile, which matters because delivery times are heavily right-skewed.
  verified: true
  notes: ""

- id: Q046
  category: ambiguous
  question: Which sellers are underperforming?
  expected_behavior: clarify
  reason: >
    "Underperforming" has no definition in the data. Candidates include low revenue,
    slow delivery, poor review scores, and high cancellation rate, and a seller can
    be bad on one while fine on the others. A threshold is also needed — most of the
    3,095 sellers are small, so almost any absolute cutoff ranks them by size rather
    than quality.
  verified: true
  notes: ""

