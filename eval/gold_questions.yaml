- id: Q050
  category: ambiguous
  question: How many customers do we have?
  expected_behavior: clarify
  reason: >
    The source data supports two defensible answers. There are 96,096 distinct
    people (customer_unique_id) and 99,441 customer records (customer_id, issued per
